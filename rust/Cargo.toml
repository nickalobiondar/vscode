[package]
name = "portsmith-replay"
version = "1.0.0"
edition = "2021"
description = "Schema inference and replay for the portsmith trace format"
license = "MIT"

[[bin]]
name = "portsmith-replay"
path = "src/main.rs"

[lib]
name = "portsmith_replay"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true

