<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="ttitle tdesc" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace">
  <title id="ttitle">portsmith trace flow: capture to replay</title>
  <desc id="tdesc">A workshop schematic showing a raw session log normalized into base64 trace records, inferred into a schema, and replayed against a live target, rendered as an oscilloscope terminal.</desc>

  <defs>
    <linearGradient id="mid2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060b16"/>
      <stop offset="1" stop-color="#0a1424"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ff0e0"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3ff0e0"/>
    </marker>
    <marker id="arrowo" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ff8a3d"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="url(#mid2)"/>
  <g stroke="#0f2438" stroke-width="1" opacity="0.6">
    <line x1="0" y1="155" x2="1200" y2="155"/>
    <line x1="0" y1="310" x2="1200" y2="310"/>
    <line x1="0" y1="465" x2="1200" y2="465"/>
  </g>

  <text x="40" y="46" font-size="22" font-weight="700" fill="#e8fbff">trace flow</text>
  <text x="40" y="68" font-size="12" fill="#7fa6c0" letter-spacing="1">capture &#8594; normalize &#8594; infer &#8594; replay &#183; one line-based, base64-framed format</text>

  <!-- ============ STAGE 1: raw session log ============ -->
  <g transform="translate(40,100)">
    <rect width="270" height="180" rx="8" fill="#0b1a2c" stroke="#1d4b6e"/>
    <rect width="270" height="26" rx="8" fill="#12283f"/>
    <text x="14" y="18" font-size="12" fill="#3ff0e0">samples/redis.log</text>
    <g font-size="12.5" fill="#bfe8f2">
      <text x="16" y="52"><tspan fill="#3ff0e0">&gt;</tspan> PING</text>
      <text x="16" y="74"><tspan fill="#ff8a3d">&lt;</tspan> +PONG</text>
      <text x="16" y="96"><tspan fill="#3ff0e0">&gt;</tspan> SET key1 hi</text>
      <text x="16" y="118"><tspan fill="#ff8a3d">&lt;</tspan> +OK</text>
      <text x="16" y="140"><tspan fill="#3ff0e0">&gt;</tspan> GET key1</text>
      <text x="16" y="162"><tspan fill="#ff8a3d">&lt;</tspan> $2 / hi</text>
    </g>
  </g>

  <!-- normalize arrow -->
  <g font-size="11" fill="#3ff0e0">
    <line x1="312" y1="190" x2="392" y2="190" stroke="#3ff0e0" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="352" y="180" text-anchor="middle">normalize</text>
    <circle cx="312" cy="190" r="3" fill="#3ff0e0">
      <animate attributeName="cx" values="312;388;312" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ STAGE 2: trace records (base64) ============ -->
  <g transform="translate(400,100)">
    <rect width="440" height="180" rx="8" fill="#0b1a2c" stroke="#1d4b6e"/>
    <rect width="440" height="26" rx="8" fill="#12283f"/>
    <text x="14" y="18" font-size="12" fill="#3ff0e0">samples/redis.trace &#183; portsmith v1</text>
    <g font-size="11" fill="#8fb8cf">
      <text x="14" y="48" fill="#546b80">#portsmith-trace v1</text>
      <text x="14" y="68"><tspan fill="#ff8a3d">V1</tspan> 1700000000000000000 <tspan fill="#3ff0e0">&gt;</tspan> a1b2c3 redis 5 <tspan fill="#e8fbff">UElORwo=</tspan></text>
      <text x="14" y="88"><tspan fill="#ff8a3d">V1</tspan> 1700000000050000000 <tspan fill="#ff8a3d">&lt;</tspan> a1b2c3 redis 6 <tspan fill="#e8fbff">K1BPTkcK</tspan></text>
      <text x="14" y="108"><tspan fill="#ff8a3d">V1</tspan> 1700000000100000000 <tspan fill="#3ff0e0">&gt;</tspan> a1b2c3 redis 12 <tspan fill="#e8fbff">U0VUIGtleTEgaGkK</tspan></text>
      <text x="14" y="128"><tspan fill="#ff8a3d">V1</tspan> 1700000000150000000 <tspan fill="#ff8a3d">&lt;</tspan> a1b2c3 redis 4 <tspan fill="#e8fbff">K09LCg==</tspan></text>
      <text x="14" y="148"><tspan fill="#ff8a3d">V1</tspan> 1700000000200000000 <tspan fill="#3ff0e0">&gt;</tspan> a1b2c3 redis 9 <tspan fill="#e8fbff">R0VUIGtleTEK</tspan></text>
      <text x="14" y="168"><tspan fill="#ff8a3d">V1</tspan> 1700000000250000000 <tspan fill="#ff8a3d">&lt;</tspan> a1b2c3 redis 6 <tspan fill="#e8fbff">JDIKaGkK</tspan></text>
    </g>
    <!-- field legend callout -->
    <g font-size="9" fill="#546b80">
      <text x="14" y="176" opacity="0"> </text>
    </g>
    <!-- highlight sweep across records -->
    <rect x="8" y="56" width="424" height="16" fill="#3ff0e0" opacity="0.10">
      <animate attributeName="y" values="56;56;76;96;116;136;156;56" dur="4.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- record field legend -->
  <g transform="translate(400,292)" font-size="9.5" fill="#7fa6c0">
    <text x="14" y="0"><tspan fill="#ff8a3d">V1</tspan> = version &#160; ts_nanos &#160; <tspan fill="#3ff0e0">dir</tspan> &#160; session &#160; proto &#160; len &#160; <tspan fill="#e8fbff">base64(payload)</tspan> &#160; &#8212; split on first 6 spaces</text>
  </g>

  <!-- infer arrow (orange) -->
  <g font-size="11" fill="#ff8a3d">
    <line x1="842" y1="190" x2="922" y2="190" stroke="#ff8a3d" stroke-width="1.6" marker-end="url(#arrowo)"/>
    <text x="882" y="180" text-anchor="middle">infer</text>
    <circle cx="842" cy="190" r="3" fill="#ff8a3d">
