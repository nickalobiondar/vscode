<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="ptitle pdesc" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace">
  <title id="ptitle">portsmith: protocol discovery &amp; replay</title>
  <desc id="pdesc">A network protocol cartographer's field manual: an oscilloscope trace of packets flowing through the capture, normalize, infer and replay pipeline.</desc>

  <defs>
    <linearGradient id="midnight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050912"/>
      <stop offset="0.55" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#060b16"/>
    </linearGradient>
    <linearGradient id="cyanline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0aa9c2" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#3ff0e0"/>
      <stop offset="1" stop-color="#0aa9c2" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ff0e0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3ff0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orangeglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#midnight)"/>

  <!-- graticule / cartographer's grid -->
  <g stroke="#14304a" stroke-width="1" opacity="0.55">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
