<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="ptitle pdesc" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace">
  <title id="ptitle">portsmith: protocol discovery &amp; replay</title>
  <desc id="pdesc">A network protocol cartographer's field manual: an oscilloscope trace of packets flowing through the capture, normalize, infer and replay pipeline.</desc>

  <defs>
    <linearGradient id="midnight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050912"/>
      <stop offset="0.55" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#060b16"/>
    </linearGradient>
    <linearGradient id="cyanline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0aa9c2" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#3ff0e0"/>
      <stop offset="1" stop-color="#0aa9c2" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ff0e0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3ff0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orangeglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#midnight)"/>

  <!-- graticule / cartographer's grid -->
  <g stroke="#14304a" stroke-width="1" opacity="0.55">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="450" y1="0" x2="450" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="750" y1="0" x2="750" y2="380"/>
    <line x1="900" y1="0" x2="900" y2="380"/>
    <line x1="1050" y1="0" x2="1050" y2="380"/>
  </g>
  <!-- center axes brighter, like a scope -->
  <g stroke="#1d4b6e" stroke-width="1.3" opacity="0.8">
    <line x1="0" y1="180" x2="1200" y2="180" stroke-dasharray="2 6"/>
  </g>

  <!-- title block -->
  <g filter="url(#soft)">
    <text x="60" y="86" font-size="52" font-weight="700" fill="#e8fbff" letter-spacing="1">portsmith</text>
  </g>
  <text x="62" y="116" font-size="16" fill="#3ff0e0" letter-spacing="3">PROTOCOL&#160;CARTOGRAPHER&#8217;S&#160;FIELD&#160;MANUAL</text>
  <text x="62" y="140" font-size="13" fill="#7fa6c0">observe an unknown wire protocol &#183; reason about it &#183; replay it</text>

  <!-- scope corner label -->
  <g fill="#ff8a3d" opacity="0.9">
    <text x="1140" y="34" font-size="12" text-anchor="end" letter-spacing="2">CH1 &#183; RX/TX</text>
    <text x="1140" y="52" font-size="11" text-anchor="end" fill="#7fa6c0" letter-spacing="2">10 ns/div &#183; base64</text>
  </g>

  <!-- animated waveform: the "signal under test" sweeping across -->
  <g filter="url(#soft)">
    <path fill="none" stroke="url(#cyanline)" stroke-width="2.4"
      d="M0,240 L120,240 L140,196 L170,196 L190,282 L220,282 L240,240 L360,240 L380,206 L420,206 L440,240 L520,240 L540,168 L560,300 L580,168 L600,240 L720,240 L740,214 L800,214 L820,240 L900,240 L920,190 L960,290 L980,190 L1000,240 L1200,240">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- moving scan beam over the waveform -->
  <g>
    <rect x="-40" y="150" width="40" height="180" fill="url(#glow)" opacity="0.5">
      <animate attributeName="x" from="-40" to="1200" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <line x1="0" y1="150" x2="0" y2="330" stroke="#3ff0e0" stroke-width="1.5" opacity="0.7">
      <animate attributeName="x1" from="0" to="1240" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0" to="1240" dur="5.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- packets riding the wire, request (cyan) and response (orange) -->
  <g>
    <rect width="18" height="12" rx="2" fill="#3ff0e0" y="234">
      <animateMotion dur="3.2s" repeatCount="indefinite"
        path="M0,0 L1200,0"/>
    </rect>
    <rect width="14" height="10" rx="2" fill="#ff8a3d" y="236">
      <animateMotion dur="3.9s" repeatCount="indefinite" begin="0.8s"
        path="M0,0 L1200,0"/>
    </rect>
    <rect width="16" height="11" rx="2" fill="#3ff0e0" y="235" opacity="0.8">
      <animateMotion dur="3.5s" repeatCount="indefinite" begin="1.7s"
        path="M0,0 L1200,0"/>
    </rect>
  </g>

  <!-- pipeline stages as scope stations -->
  <g font-size="13" text-anchor="middle">
    <g transform="translate(180,335)">
      <circle r="5" fill="#3ff0e0"><animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite"/></circle>
      <text y="26" fill="#bfe8f2">capture</text>
    </g>
    <g transform="translate(450,335)">
      <circle r="5" fill="#3ff0e0"><animate attributeName="r" values="4;6.5;4" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle>
      <text y="26" fill="#bfe8f2">normalize</text>
    </g>
    <g transform="translate(760,335)">
      <circle r="5" fill="#ff8a3d"><animate attributeName="r" values="4;6.5;4" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
      <text y="26" fill="#ffcfa6">infer</text>
    </g>
    <g transform="translate(1010,335)">
      <circle r="5" fill="#ff8a3d"><animate attributeName="r" values="4;6.5;4" dur="2s" begin="1.5s" repeatCount="indefinite"/></circle>
      <text y="26" fill="#ffcfa6">replay</text>
    </g>
    <line x1="185" y1="335" x2="445" y2="335" stroke="#1d4b6e" stroke-dasharray="3 4"/>
    <line x1="455" y1="335" x2="755" y2="335" stroke="#1d4b6e" stroke-dasharray="3 4"/>
    <line x1="765" y1="335" x2="1005" y2="335" stroke="#1d4b6e" stroke-dasharray="3 4"/>
  </g>

  <!-- inferred schema glyph, top-right: a small "map legend" -->
  <g transform="translate(880,74)" font-size="11" fill="#7fa6c0">
    <rect x="0" y="-16" width="260" height="70" rx="6" fill="#0b1a2c" stroke="#1d4b6e"/>
    <text x="12" y="0" fill="#3ff0e0" font-size="10" letter-spacing="2">INFERRED SCHEMA</text>
    <text x="12" y="18">encoding : <tspan fill="#e8fbff">text</tspan>  terminator : <tspan fill="#e8fbff">LF</tspan></text>
    <text x="12" y="34">tokens : <tspan fill="#ff8a3d">GET</tspan> <tspan fill="#ff8a3d">SET</tspan> <tspan fill="#ff8a3d">PING</tspan></text>
    <text x="12" y="50" fill="#546b80">len min=5 max=12 mean=8.7</text>
    <circle cx="245" cy="-4" r="3" fill="#ff8a3d"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
  </g>
</svg>

# draft note 8
