name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  go:
    name: Go (portcap)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
